name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**", "docs/**", "ci/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax and whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          git ls-files -z -- '*.mjs' | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git merge-base origin/master "$HEAD_SHA")"
          fi
          git diff --check "$base" "$HEAD_SHA"

  test:
    name: Node ${{ matrix.node }} offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20.11", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # Os testes de mídia real são condicionais a FFmpeg existir: o espelho apt
      # não pode travar o job (já travou >6 min). Falha aqui = testes de mídia
      # ignorados, nunca um falso verde dos restantes.
      - name: Install local media decoders (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo timeout 240 apt-get update
          sudo timeout 240 apt-get install -y --no-install-recommends ffmpeg
      - name: Legacy selftest
        run: node scripts/som.mjs selftest
      - name: Unit and contract tests (no model credentials)
        run: node --test

  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate new Conventional Commits only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          base, head = os.environ.get('BASE_SHA', ''), os.environ['HEAD_SHA']
          if not base or set(base) == {'0'}:
              base = subprocess.check_output(['git', 'merge-base', 'origin/master', head], text=True).strip()
          subjects = subprocess.check_output(['git', 'log', '--format=%s', f'{base}..{head}'], text=True).splitlines()
          conventional = re.compile(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]*\))?!?: .+')
          bad = []
          for subject in subjects:
              if subject.startswith(('Merge ', 'Revert "', 'Reapply "')):
                  continue
              header = re.sub(r'\s+\(#\d+\)$', '', subject)
              if not conventional.match(header) or len(header) > 72:
                  bad.append(subject)
          for subject in bad:
              print('Invalid new commit:', subject)
          print(f'Checked {len(subjects)} new commit(s); legacy remote history is not rewritten.')
          sys.exit(bool(bad))
          PY
