# =============================================================================
# OpenSSF Scorecard — jev-agent-skill (frederico-kluser/jev-agent-skill)
#
# NOTA (para o agente): fixe as actions por SHA com `bash scripts/oss-pin-actions.sh`
# antes do primeiro push (owner/repo@<PIN_SHA> # vX.Y.Z).
#
# Análise contínua da cadeia de fornecimento; resultados publicados em
# https://securityscorecards.dev (publish_results: true) e carregados como
# artefato SARIF para revisão.
# =============================================================================

name: OpenSSF Scorecard

on:
  branch_protection_rule:   # re-avaliar quando os rulesets mudarem
  schedule:
    - cron: "30 5 * * 1"    # semanalmente, segunda-feira às 05:30 UTC
  push:
    branches:
      - "master"

# Privilégio mínimo global; cada job declara a elevação pontual de que precisa.
permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # gravar SARIF em code scanning
      id-token: write         # OIDC para publicar resultados assinados
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
