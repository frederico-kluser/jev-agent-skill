# git-cliff configuration for jev-agent-skill
# https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md from Conventional Commits. Usage:
#   git-cliff --config cliff.toml -o CHANGELOG.md          # full history
#   git-cliff --config cliff.toml --tag v0.2.0 -o CHANGELOG.md
#
# NOTE: `{{ version }}`-style expressions below are Tera template variables for
# git-cliff, NOT scaffold placeholders — the scaffold only substitutes
# {{UPPER_SNAKE_CASE}} placeholders such as jev-agent-skill.

[changelog]
# Top of the file: title, conventions, and links.
header = """
# Changelog\n
All notable changes to **jev-agent-skill** will be documented in this file.\n
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""

# Per-release body: one section per conventional-commit group.
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""

footer = """
<!-- generated by git-cliff -->
"""

# Remove leading/trailing whitespace from the rendered template.
trim = true

[git]
# Parse commits as Conventional Commits; unconventional commits are dropped
# from the changelog (they still exist in history).
conventional_commits = true
filter_unconventional = true
split_commits = false

# Map commit types to changelog sections (order = section order).
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs?", group = "Documentation" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build System" },
  { message = "^ci", group = "CI/CD" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^revert", group = "Reverts" },
  { message = ".*", group = "Other" },
]

# Keep breaking changes visible even when their type would skip them.
protect_breaking_commits = false
filter_commits = false

# Only tags like v1.2.3 start a new changelog section.
tag_pattern = "v[0-9]*"
ignore_tags = ""

# Oldest first within each release section.
topo_order = false
sort_commits = "oldest"
